# Boots the real SwanStation core, built with the host's patches, through the host on each system.
# The BIOS and the program are built here from pcsx-redux's nugget (MIT): OpenBIOS and the psyqo
# "hello" example. No Sony BIOS or game is used. Each system's core must report the core build
# identity tools/core_identity.py computes, and the same-core job checks that every system reports
# the same one (docs/netplay.md "Core build identity"). The ps2 jobs build LRPS2, the PS2 core, with
# the host's patches and check what the host reports for it without a BIOS (docs/ps2.md).
name: real-core
on: [push, pull_request]
permissions:
  contents: read
env:
  NUGGET_COMMIT: 875bfcbe3ea5d1a0de0de0f3c88c9f977fb9abf4
  SWANSTATION_COMMIT: 631f0fb31b809e0f889d7c551fe695788e39c1d3
  LRPS2_COMMIT: c0d39a58e0417189abdd2d77ba1b73126083b41f
jobs:
  ps1-files:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mipsel-linux-gnu
      - name: Fetch nugget
        run: |
          git init -q nugget
          git -C nugget fetch -q --depth 1 https://github.com/pcsx-redux/nugget.git "$NUGGET_COMMIT"
          git -C nugget checkout -q FETCH_HEAD
          git -C nugget submodule update -q --init --depth 1 --recursive
      - name: Build OpenBIOS and the hello program
        run: |
          make -C nugget/openbios -j4 PREFIX=mipsel-linux-gnu FORMAT=elf32-tradlittlemips BOOT_MODE=fast all
          make -C nugget/psyqo/examples/hello -j4 PREFIX=mipsel-linux-gnu FORMAT=elf32-tradlittlemips all
      - name: Pad OpenBIOS to the 512 KiB a BIOS chip holds, which SwanStation requires
        run: |
          mkdir out
          cp nugget/openbios/openbios.bin out/openbios.bin
          test "$(stat -c %s out/openbios.bin)" -le 524288
          truncate -s 524288 out/openbios.bin
          cp nugget/psyqo/examples/hello/hello.ps-exe out/hello.exe
          cp nugget/LICENSE out/LICENSE
          cp nugget/psyqo/examples/hello/hello.cpp out/hello.cpp
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ps1-files
          path: out

  run:
    needs: ps1-files
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            core: swanstation/build/swanstation_libretro.so
            host: build/anyps5-retro-host
            python: python3
            opengl: --expect-opengl
          - os: ubuntu-24.04
            core: swanstation/build/swanstation_libretro.so
            host: build/anyps5-retro-host
            python: python3
            opengl: --expect-opengl
          - os: macos-latest
            core: swanstation/build/swanstation_libretro.dylib
            host: build/anyps5-retro-host
            python: python3
            opengl: --expect-opengl
          - os: windows-2022
            core: swanstation/build/swanstation_libretro.dll
            host: build/Release/anyps5-retro-host.exe
            python: python
            opengl: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: ps1-files
          path: ps1-files
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libegl1 libgl1 libgles2 libegl-mesa0 mesa-utils
      - name: Fetch SwanStation
        run: |
          git init -q swanstation
          git -C swanstation fetch -q --depth 1 https://github.com/libretro/swanstation.git "$SWANSTATION_COMMIT"
          git -C swanstation checkout -q FETCH_HEAD
          git -C swanstation submodule update -q --init --depth 1 --recursive
      - name: Apply the host's SwanStation patches
        run: bash cores/apply-swanstation-patches.sh swanstation
      - name: Build SwanStation
        run: |
          cmake -S swanstation -B swanstation/build -DCMAKE_BUILD_TYPE=Release
          cmake --build swanstation/build --config Release --parallel 4
      - name: Build the host
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Run the real core, which must report the core build identity
        run: |
          identity="$(${{ matrix.python }} tools/core_identity.py --swanstation-commit "$SWANSTATION_COMMIT")"
          ${{ matrix.python }} tests/real_core.py --host ${{ matrix.host }} --core ${{ matrix.core }} --bios ps1-files/openbios.bin --program ps1-files/hello.exe --log build/real-core.log --picture build/real-core.png ${{ matrix.opengl }} --expect-core-version "$identity" --core-identity-out "build/core-identity-${{ matrix.os }}.json"
      - if: failure()
        run: tail -200 build/real-core.log || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: real-core-${{ matrix.os }}
          path: build/real-core.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: core-identity-${{ matrix.os }}
          path: build/core-identity-${{ matrix.os }}.json
          if-no-files-found: error

  same-core:
    needs: run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: core-identity-*
          path: identities
          merge-multiple: true
      - name: Windows, Linux and macOS builds report the same core build identity
        run: |
          test "$(ls identities/*.json | wc -l)" -eq 4
          python3 tools/core_identity.py --same identities/*.json --swanstation-commit "$SWANSTATION_COMMIT"

  # LRPS2, the PS2 core (docs/ps2.md "The core"), at LRPS2_COMMIT with the host's patches, built with
  # the options its core build identity names. There is no freely licensed PS2 BIOS and LRPS2 boots
  # nothing without one (docs/ps2.md "The BIOS"), so tests/ps2_core.py checks that the host loads
  # it, reports its core build identity and console, and ends a game with errorCode bios when no
  # BIOS is there; same-ps2-core checks that every system's build reports the same identity.
  ps2:
    name: ps2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            core: lrps2/build/bin/pcsx2_libretro.so
            host: build/anyps5-retro-host
            python: python3
            generator: -G Ninja
          - os: ubuntu-24.04
            core: lrps2/build/bin/pcsx2_libretro.so
            host: build/anyps5-retro-host
            python: python3
            generator: -G Ninja
          - os: macos-latest
            core: lrps2/build/libretro/pcsx2_libretro.dylib
            host: build/anyps5-retro-host
            python: python3
            generator: ''
          - os: windows-2022
            core: lrps2/build/libretro/Release/pcsx2_libretro.dll
            host: build/Release/anyps5-retro-host.exe
            python: python
            generator: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libegl1 libgl1 libgles2 libegl-mesa0
      - name: Fetch LRPS2
        run: |
          git init -q lrps2
          git -C lrps2 config core.autocrlf false
          git -C lrps2 fetch -q --depth 1 https://github.com/libretro/parallel-ps2.git "$LRPS2_COMMIT"
          git -C lrps2 checkout -q FETCH_HEAD
          git -C lrps2 submodule update -q --init --depth 1 --recursive
      - name: Apply the host's LRPS2 patches
        run: bash cores/apply-core-patches.sh lrps2 lrps2
      - name: Build LRPS2 with the options its core build identity names
        run: |
          cmake -S lrps2 -B lrps2/build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release \
            -DC89_EMITTER=ON -DDISABLE_ADVANCE_SIMD=ON -DUSE_OPENGL=ON -DUSE_VULKAN=ON
          cmake --build lrps2/build --config Release --target pcsx2_libretro --parallel 4
      - name: Build the host
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: LRPS2 through the host with no BIOS, which must report its core build identity
        run: |
          identity="$(${{ matrix.python }} tools/core_identity.py --lrps2-commit "$LRPS2_COMMIT")"
          ${{ matrix.python }} tests/ps2_core.py --host ${{ matrix.host }} --core ${{ matrix.core }} --log build/ps2-core.log --expect-core-version "$identity" --core-identity-out "build/ps2-core-identity-${{ matrix.os }}.json"
      - if: failure()
        run: tail -200 build/ps2-core.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ps2-core-identity-${{ matrix.os }}
          path: build/ps2-core-identity-${{ matrix.os }}.json
          if-no-files-found: error

  same-ps2-core:
    needs: ps2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: ps2-core-identity-*
          path: identities
          merge-multiple: true
      - name: Windows, Linux and macOS builds of LRPS2 report the same core build identity
        run: |
          test "$(ls identities/*.json | wc -l)" -eq 4
          python3 tools/core_identity.py --same identities/*.json --lrps2-commit "$LRPS2_COMMIT"
